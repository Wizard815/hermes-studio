services:
  hermes-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WEBUI_IMAGE:-hermes-web-ui-local:latest}
    container_name: ${WEBUI_CONTAINER_NAME:-hermes-webui}
    ports:
      - "${PORT:-6060}:${PORT:-6060}"
      - "${PREVIEW_FRONTEND_PORT:-8651}:8651"
      - "${XAI_OAUTH_PORT:-56121}:56121"
      # Hermes Gadget (recommended plugin): devices such as D.A.S.H connect to ws://<host>:8765/gadget.
      # Plain ws:// with pairing codes: publish it on your LAN only (e.g. "192.168.1.20:8765:8765").
      - "${STUDIO_GADGET_PUBLISH:-8765}:${STUDIO_GADGET_PORT:-8765}"
      - "${STUDIO_P2P_UDP_PORT_RANGE:-50000-50127}:${STUDIO_P2P_UDP_PORT_RANGE:-50000-50127}/udp"
    volumes:
      - ${HERMES_DATA_DIR:-./hermes_data}:/home/agent/.hermes
      - ${HERMES_DATA_DIR:-./hermes_data}/hermes-web-ui:/home/agent/.hermes-web-ui
      # adb's key: phones and BlueStacks stay authorized after the container is recreated.
      - ${HERMES_DATA_DIR:-./hermes_data}/android:/home/agent/.android
      # herdr's config, chat spaces and sessions: herdr picks up where it was after the container is recreated.
      - ${HERMES_DATA_DIR:-./hermes_data}/herdr/config:/home/agent/.config/herdr
      - ${HERMES_DATA_DIR:-./hermes_data}/herdr/state:/home/agent/.local/state/herdr
      # System page → Docker, and clean-room chats (/cleanroom: a chat's agent runs in its own
      # container). This gives Studio full control of the host's Docker. Clean rooms also need
      # each chat's folder on a mounted volume (e.g. under ./hermes_data) so Docker can share it.
      # - /var/run/docker.sock:/var/run/docker.sock
      # Sandboxes and Test Lab: the sandbox-docker sidecar below, never the host's socket.
      - sandbox-docker:/run/sandbox-docker
    environment:
      - PORT=${PORT:-6060}
      - HERMES_HOME=/home/agent/.hermes
      - HERMES_BIN=/opt/hermes/.venv/bin/hermes
      - HERMES_WEB_UI_MANAGED_GATEWAY=1
      - HERMES_WEB_UI_AUTH_JWT_EXPIRES_IN=${HERMES_WEB_UI_AUTH_JWT_EXPIRES_IN:-30d}
      - HERMES_WEB_UI_XAI_CALLBACK_BIND_HOST=0.0.0.0
      - HERMES_PATCH_SCRIPT=${HERMES_PATCH_SCRIPT:-}
      - HERMES_LAN_ADVERTISE_URL=${HERMES_LAN_ADVERTISE_URL:-}
      - HERMES_APP_ENTITLEMENT_REQUIRED=${HERMES_APP_ENTITLEMENT_REQUIRED:-true}
      - HERMES_APP_ENTITLEMENT_PUBLIC_KEY=${HERMES_APP_ENTITLEMENT_PUBLIC_KEY:-}
      # Keep defaults in Studio so an unset/invalid new name can use its legacy alias.
      - EKKO_STUDIO_DSH_ACP_TIMEOUT_MS=${EKKO_STUDIO_DSH_ACP_TIMEOUT_MS:-}
      - EKKO_STUDIO_ACP_TIMEOUT_MS=${EKKO_STUDIO_ACP_TIMEOUT_MS:-}
      - EKKO_STUDIO_AGENT_MODEL_DISCOVERY_TIMEOUT_MS=${EKKO_STUDIO_AGENT_MODEL_DISCOVERY_TIMEOUT_MS:-}
      - HERMES_DSH_ACP_TIMEOUT_MS=${HERMES_DSH_ACP_TIMEOUT_MS:-}
      - HERMES_ACP_TIMEOUT_MS=${HERMES_ACP_TIMEOUT_MS:-}
      - HERMES_AGENT_MODEL_DISCOVERY_TIMEOUT_MS=${HERMES_AGENT_MODEL_DISCOVERY_TIMEOUT_MS:-}
      - STUDIO_P2P_UDP_PORT_RANGE=${STUDIO_P2P_UDP_PORT_RANGE:-50000-50127}
      # Recommended Hermes plugins once per profile (0 turns it off); Gadget's bind address and port
      # inside the container, written when Studio first turns the Gadget platform on.
      - STUDIO_RECOMMENDED_HERMES_PLUGINS=${STUDIO_RECOMMENDED_HERMES_PLUGINS:-}
      - STUDIO_GADGET_HOST=${STUDIO_GADGET_HOST:-0.0.0.0}
      - STUDIO_GADGET_PORT=${STUDIO_GADGET_PORT:-8765}
      - STUDIO_P2P_INTERFACE=${STUDIO_P2P_INTERFACE:-}
      - STUDIO_P2P_ADVERTISE_ADDRESSES=${STUDIO_P2P_ADVERTISE_ADDRESSES:-}
      - NPM_CONFIG_PREFIX=/home/agent/.hermes-web-ui/coding-agent/npm
      - PATH=/home/agent/.hermes-web-ui/coding-agent/npm/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - HERMES_ALLOW_ROOT_GATEWAY=1
      - STUDIO_SANDBOX_DOCKER_HOST=unix:///run/sandbox-docker/docker.sock
    # System page: see the host's processes instead of only the container's.
    # pid: host
    restart: unless-stopped
    stdin_open: true
    tty: true
    depends_on:
      sandbox-docker:
        condition: service_started

  # Studio's own Docker for sandboxes and Test Lab (docs/sandbox.md). Agents run shell commands
  # in Studio's container, so whatever Docker Studio can reach, they can too: this one holds
  # only sandboxes, not Unraid's containers. Rootless, so even a --privileged container started
  # in it stays an unprivileged user on the host. Needs /dev/net/tun.
  sandbox-docker-init:
    image: alpine:3.22
    command: ["chown", "1000:1000", "/run/sandbox-docker"]
    volumes:
      - sandbox-docker:/run/sandbox-docker
  sandbox-docker:
    image: docker:28-dind-rootless
    container_name: ${WEBUI_CONTAINER_NAME:-hermes-webui}-sandbox-docker
    privileged: true # rootless dockerd still needs it to set up its user namespace
    devices:
      - /dev/net/tun
    environment:
      - DOCKER_TLS_CERTDIR=
      - XDG_RUNTIME_DIR=/run/sandbox-docker
    # Only the shared unix socket: no TCP port, nothing published.
    command: ["--host=unix:///run/sandbox-docker/docker.sock"]
    volumes:
      - sandbox-docker:/run/sandbox-docker
      # Test Lab binds its run folders into lab containers: the same path as in Studio.
      - ${HERMES_DATA_DIR:-./hermes_data}/hermes-web-ui:/home/agent/.hermes-web-ui
    depends_on:
      sandbox-docker-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  sandbox-docker:
